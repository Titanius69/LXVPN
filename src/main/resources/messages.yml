# ---------------------------------------------------------------------------
#  LXVPN messages
#
#  Colour codes use &. One file for both proxies.
#
#  A word on the kick screens: say what happened and what to do about it. A
#  player refused with "Connection denied" assumes the server is broken and goes
#  elsewhere; one told their VPN is the problem turns it off and comes back.
# ---------------------------------------------------------------------------

prefix: "&8[&bLX&3VPN&8] &r"

vpn-blocked: |-
  &c&lConnection refused
  
  &7This network does not allow connections through a
  &7VPN, proxy or Tor.
  
  &7Turn it off and reconnect. If you are not using one,
  &7let us know and we will look into it.

country-blocked: |-
  &c&lConnection refused
  
  &7This network does not accept connections from your
  &7region.

ip-restricted: |-
  &c&lConnection refused
  
  &7This account is locked to a different address.
  &7Contact staff if that is not expected.

no-permission: "&cYou do not have permission to use that."
reload-success: "&aConfiguration reloaded."
reload-failed: "&cReload failed. The previous configuration is still active; see the console."
usage: "&7Usage: &f/lxvpn <check|reload|stats|blacklist|iprestrict>"
